<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Home')}"></head>
  <body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container">
      <div class="p-5 mb-4 bg-white border rounded-3 shadow-sm">
        <h1 class="display-6">Find your room</h1>
        <p class="text-muted">Pick your dates and see which rooms are free.</p>

        <form th:action="@{/rooms}" method="get" class="row g-2">
          <div class="col-sm-4">
            <label class="form-label">Check-in</label>
            <input
              type="date"
              name="checkIn"
              class="form-control"
              th:min="${today}"
              required
            />
          </div>
          <div class="col-sm-4">
            <label class="form-label">Check-out</label>
            <input
              type="date"
              name="checkOut"
              class="form-control"
              th:min="${today}"
              required
            />
          </div>
          <div class="col-sm-4 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">
              Search available rooms
            </button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
