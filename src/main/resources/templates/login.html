<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Log in')}"></head>
  <body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container" style="max-width: 420px">
      <h1 class="h3 mb-3">Log in</h1>

      <div class="alert alert-danger" th:if="${param.error}">
        Invalid username or password.
      </div>
      <div class="alert alert-info" th:if="${param.logout}">
        You have been logged out.
      </div>
      <div class="alert alert-success" th:if="${param.registered}">
        Account created. You can log in now.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Username"
            required
          />
        </div>
        <div class="mb-3">
          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>

      <p class="mt-3"><a th:href="@{/register}">Create an account</a></p>
    </main>
  </body>
</html>
