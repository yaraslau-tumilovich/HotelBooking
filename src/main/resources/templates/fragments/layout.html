<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} + ' | Hotel Booking'">Hotel Booking</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/css/site.css}" rel="stylesheet" />
  </head>
  <body>
    <nav
      th:fragment="navbar"
      class="navbar navbar-expand navbar-dark bg-dark mb-4"
    >
      <div class="container">
        <a class="navbar-brand" th:href="@{/}">Hotel Booking</a>
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/rooms}">Rooms</a>
          </li>
          <li class="nav-item" th:if="${currentUser != null}">
            <a class="nav-link" th:href="@{/my-bookings}">My bookings</a>
          </li>
        </ul>
        <div
          class="d-flex align-items-center gap-2"
          th:if="${currentUser == null}"
        >
          <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Log in</a>
          <a class="btn btn-primary btn-sm" th:href="@{/register}">Register</a>
        </div>
        <div
          class="d-flex align-items-center gap-2"
          th:if="${currentUser != null}"
        >
          <span class="navbar-text" th:text="${currentUser}"></span>
          <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">
              Log out
            </button>
          </form>
        </div>
      </div>
    </nav>

    <div th:fragment="messages">
      <div
        class="alert alert-success"
        th:if="${success}"
        th:text="${success}"
      ></div>
      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    </div>
  </body>
</html>
