<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('My bookings')}"></head>
  <body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container">
      <div th:replace="~{fragments/layout :: messages}"></div>

      <h1 class="h3 mb-3">My bookings</h1>

      <p class="text-muted" th:if="${bookings.isEmpty()}">
        You have no bookings yet. <a th:href="@{/rooms}">Find a room</a>.
      </p>

      <table
        class="table table-striped align-middle bg-white"
        th:if="${!bookings.isEmpty()}"
      >
        <thead>
          <tr>
            <th>Room</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Nights</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="b : ${bookings}">
            <td th:text="${b.room.roomNumber}"></td>
            <td th:text="${b.checkIn}"></td>
            <td th:text="${b.checkOut}"></td>
            <td th:text="${b.nights}"></td>
            <td th:text="${#numbers.formatDecimal(b.totalPrice, 1, 2)}"></td>
            <td class="text-end">
              <form
                th:action="@{/bookings/{id}/cancel(id=${b.id})}"
                method="post"
                onsubmit="return confirm('Cancel this booking?');"
              >
                <button type="submit" class="btn btn-outline-danger btn-sm">
                  Cancel
                </button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
